<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles/div-practice.css">
    <title>div practice</title>
  </head>
  <body>
    <div class="red-box">
      <p class="red-square"></p>
    </div>

    <div class="green-circle"></div>

    <div class="survey">
      <p class="survey-question">
        Satisfied with our service?
      </p>
      <button class="yes-no-button">Yes</button>
      <button class="yes-no-button">No</button>
    </div>

    <div class="youtube-music">
      <p class="install">Install Youtube Music</p>
      <p class="add">Add YouTube Music to your desktop for quick and early access</p>
    </div>

    <div class="pic">
      <img class="profile-picture" src="images/uncle-ted.avif">
      <input type="text" class="text-box" placeholder="What's happening?">
      <button class="tweet-button">
        Tweet
      </button>
    </div>

    <div class="card">
      <img class="pic01" src="images/uncle-ted.avif" alt="">
      <p class="name">Ted</p>
      <p class="friends">2 mutual friends</p>
      <button class="add-friend">Add Friend</button>
    </div>

    <div class="card">
      <img class="pic01" src="images/uncle-ted.avif" alt="">
      <p class="name">Ted</p>
      <p class="friends">2 mutual friends</p>
      <button class="add-friend">Add Friend</button>
    </div>

    <div class="card">
      <img class="pic01" src="images/uncle-ted.avif" alt="">
      <p class="name">Ted</p>
      <p class="friends">2 mutual friends</p>
      <button class="add-friend">Add Friend</button>
    </div>
  </body>
</html>
