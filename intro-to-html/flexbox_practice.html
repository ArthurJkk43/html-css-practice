<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles/flexbox_practice.css">
    <title>Flexbox Practice</title>
  </head>
  <body class="body">
    <div class="flexbox01">
      <p style="
        width: 200px;
        background-color: lightblue;
        ">200px</p>
      <p style="
        width: 75px;
        background-color: lightpink;
        ">75px</p>
    </div>

    <div class="flexbox02">
      <div class="item01">item1</div>
      <div class="item02">item2</div>
      <div class="item03">item3</div>
    </div>

    <div class="flexbox03">
      <div class="item">item1</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>

    <div class="flexbox04">
      <div class="item">item1</div>
      <div class="item">item2</div>
    </div>

    <div class="container">
      <div class="flexbox05">
        <div>Home</div>
        <div class="notifications">14</div>
      </div>
      <div class="flexbox05">
        <div>Notifications</div>
        <div class="notifications">3</div>
      </div>
      <div class="flexbox05">
        <div>Messages</div>
        <div class="notifications">5</div>
      </div>
    </div>

    <div class="header">
      <div class="home-link">Home</div>
      <input class="text-box" placeholder="Search">
      <button>Download</button>
    </div>

    <div class="row">
      <img class="profile-picture" src="images/uncle-ted.avif">
      <div class="info">
        <p class="name">oliver</p>
        <p class="handle">the cat</p>
        <p class="category">Popular</p>
      </div>
      <button class="follow-button">Follow</button>
    </div>

    <div class="row">
      <img class="profile-picture" src="images/uncle-ted.avif">
      <div class="info">
        <p class="name">Mimi</p>
        <p class="handle">Sleepy Cat</p>
        <p class="category">Popular</p>
      </div>
      <button class="follow-button">Follow</button>
    </div>

    <div class="row">
      <img class="profile-picture" src="images/uncle-ted.avif">
      <div class="info">
        <p class="name">Rex</p>
        <p class="handle">Happy Bulldog</p>
        <p class="category">Popular</p>
      </div>
      <button class="follow-button">Follow</button>
    </div>

  </body>
</html>
