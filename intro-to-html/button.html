<!DOCTYPE html>
<html>
  <head>
    <title>Buttons Practice</title>
    <link rel="stylesheet" href="styles/button.css">
  </head>
  <body>
    <button class="subscribe-button">
      SUBSCRIBE NOW
    </button>

    <button class="join-button">
      JOIN my channel
    </button>

    <button class="tweet-button">
      Tweet
    </button>

    <button class="request-now-button">
      Request now
    </button>

    <button class="add-to-cart-button">
      Add to Cart
    </button>

    <button class="sign-up-button">
      Sign up
    </button>

    <button class="get-started-button">
      Get started
    </button>

    <button class="download-button">
      Download
    </button>

    <button class="apply-on-company-website-button">
      Apply on company website
    </button>

    <button class="save-button">
      Save
    </button>

    <!----------------------------------------------------->

    <a href="https://www.amazon.com/" class = "back-to-amazon-link" target="_blank">
      Back to Amazon
    </a>

    <p class="product-name">
      Nike Black Running Shoes
    </p>

    <p class="product-price">
      $39 - in stock.
    </p>

    <p class="product-delivery">
      Free delivery tomorrow.
    </p>

    <button class="add-to-cart-button">
      Add to Cart
    </button>

    <button class="buy-now-button">
      Buy Now
    </button>

    <button class="back-next-button">
      Back
    </button>

    <a class="pagination" href="https://google.com/">1</a>
    <a class="pagination" href="https://google.com/">2</a>
    <a class="pagination" href="https://google.com/">3</a>
    <a class="pagination" href="https://google.com/">4</a>
    <a class="pagination" href="https://google.com/">5</a>

    <button class="back-next-button">
      Next
    </button>

    <button class="stretch-button">
      Stretch
    </button>

    <button class="shadow-button">
      Shadow
    </button>

    <button class="number-button">
      One
    </button>

    <button class="number-button">
      Two
    </button>

    <button class="number-button">
      Three
    </button>
      </body>
</html>
