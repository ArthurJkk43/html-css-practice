<!DOCTYPE html>
<html>
  <head>
    <title>Image Practice</title>
    <style>
      .image-1 {
        width: 200px;
        border-radius: 50px;
        margin-right: 200px;
      }

      .image-2 {
        width: 200px;
        aspect-ratio: 1/1;
        margin-right: 200px;
        object-fit: cover;
      }

      .image-3 {
        width: 200px;
        height: 200px;
        border-radius: 200px;
        margin-right: 200px;
      }
    </style>
  </head>
  <body>
    <img class="image-1" src="images/uncle-ted.avif" alt="">
    <img class="image-2" src="images/uncle-ted.avif" alt="">
    <img class="image-3" src="images/uncle-ted.avif" alt="">
  </body>
</html>
