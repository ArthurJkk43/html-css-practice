<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles/display-inline-block-practice.css">
    <title>display-inline-block-practice</title>
  </head>
  <body>
    <input class="name" type="text" placeholder="Name">
    <input class="email" type="text" placeholder="Email">

    <p class="survey">
      Thanks for chatting with our customer support. Would like to take our quick survey?
    </p>
    <button class="yes-no-button">Yes</button>
    <button class="yes-no-button">No</button>

    <img class="google-img" src="images/google-logo-transparent.png" alt="">
    <input class="google-search-bar" type="text" placeholder="Search Google or type a URL">

    <input class="name-2" type="text" placeholder="Name">
    <input class="lastname-1" type="text" placeholder="Last Name">
    <input class="email-2" type="text" placeholder="Email">

    <button class="sign-up">Sign Up</button>

    <p class="request">Request a ride now</p>
    <input class="location" type="text" placeholder="Enter pickup location">
    <input class="destination" type="text" placeholder="Enter destination">
    <button class="request-button">Request now</button>
    <button class="schedule-button">Schedule for later</button>


  </body>
</html>
